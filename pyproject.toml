[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localtext"
version = "0.1.0"
description = "Private desktop AI text detection and high-quality rephrasing on Arch Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
detector = ["torch>=2.6,<3", "transformers>=4.45,<5", "safetensors>=0.4", "sentencepiece>=0.2", "protobuf>=4"]

[tool.setuptools.package-data]
"localtext.rephrase" = ["prompts/*.txt", "prompts/modes/*.txt"]

[project.scripts]
localtext = "localtext.main:main"

[tool.setuptools.packages.find]
where = ["src"]

