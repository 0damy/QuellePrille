[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localtext"
version = "0.1.0"
description = "Private desktop AI text detection and high-quality rephrasing on Arch Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
]

[project.scripts]
localtext = "localtext.main:main"

[tool.setuptools.packages.find]
where = ["src"]
